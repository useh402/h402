[project]
name = "humanapi-api"
version = "0.1.0"
description = "HumanAPI task API: agents pay humans per task over x402"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.28",
  "eth-account>=0.13",
  "web3>=7,<8",
  "solana>=0.36,<0.42",
  "solders>=0.27",
  "base58>=2.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.2"]
chain = ["web3>=7,<8"]  # settling tasks through the TaskEscrow contract
demo = ["x402[evm,svm,extensions]==2.25.0", "web3>=7,<8"]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.6"]

[project.scripts]
humanapi-api = "humanapi_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humanapi_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
